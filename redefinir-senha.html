<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha — Freitag Gestão</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #121212; color: #f3f3f3; font: 16px Arial, sans-serif; }
    main { width: 100%; max-width: 420px; padding: 28px; background: #191919; border: 1px solid #333; border-radius: 16px; }
    h1 { margin-top: 0; }
    p { color: #bbb; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input, button { width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; }
    input { color: white; background: #101010; border: 1px solid #444; }
    button { margin-top: 20px; color: white; background: #a778ff; border: 0; font-weight: bold; }
    button:disabled { opacity: .6; }
    #aviso { overflow-wrap: anywhere; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <h1>Criar nova senha</h1>
    <p>Digite sua nova senha duas vezes.</p>
    <form id="formulario" hidden>
      <label for="senha">Nova senha</label>
      <input id="senha" type="password" minlength="6" required autocomplete="new-password">
      <label for="confirmacao">Digite a senha novamente</label>
      <input id="confirmacao" type="password" minlength="6" required autocomplete="new-password">
      <button id="botao" type="submit">Salvar nova senha</button>
    </form>
    <p id="aviso" role="status">Verificando o link de recuperação…</p>
  </main>
  <script>
    const URL_SUPABASE = "https://jhnucvynknltahppairt.supabase.co";
        const CHAVE_PUBLICA = "sb_publishable_PYucvw3zy5nBXPkPTEIVkg_I2kHpz-O";
    const formulario = document.getElementById("formulario");
    const aviso = document.getElementById("aviso");
    const botao = document.getElementById("botao");
    let cliente;

    function comTempoLimite(promessa, ms = 15000) {
      return Promise.race([
        promessa,
        new Promise((_, rejeitar) => setTimeout(() => rejeitar(new Error("A verificação demorou demais. Recarregue a página e abra o link mais recente do e-mail.")), ms))
      ]);
    }

    async function iniciar() {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          throw new Error("Não consegui carregar o serviço de autenticação. Confira a internet e recarregue a página.");
        }

        cliente = window.supabase.createClient(URL_SUPABASE, CHAVE_PUBLICA, {
          auth: { detectSessionInUrl: false, persistSession: true, flowType: "implicit" }
        });

        const query = new URLSearchParams(location.search);
        const fragmento = new URLSearchParams(location.hash.replace(/^#/, ""));
        const erroLink = query.get("error_description") || fragmento.get("error_description");
        if (erroLink) throw new Error(decodeURIComponent(erroLink.replaceAll("+", " ")));

        const codigo = query.get("code");
        const tokenHash = query.get("token_hash");
        const tipo = query.get("type") || fragmento.get("type");
        let verificacao = null;

        if (codigo) {
          verificacao = await comTempoLimite(cliente.auth.exchangeCodeForSession(codigo));
        } else if (tokenHash && tipo) {
          verificacao = await comTempoLimite(cliente.auth.verifyOtp({ token_hash: tokenHash, type: tipo }));
        } else if (fragmento.get("access_token") && fragmento.get("refresh_token")) {
          verificacao = await comTempoLimite(cliente.auth.setSession({
            access_token: fragmento.get("access_token"),
            refresh_token: fragmento.get("refresh_token")
          }));
        } else {
          verificacao = await comTempoLimite(cliente.auth.getSession());
        }

        if (verificacao && verificacao.error) throw verificacao.error;
        const sessao = await comTempoLimite(cliente.auth.getSession());
        if (sessao.error) throw sessao.error;
        if (!sessao.data.session) {
          throw new Error("Este link não confirmou sua identidade. Abra o link mais recente de recuperação que chegou por e-mail.");
        }

        history.replaceState({}, document.title, location.pathname);
        formulario.hidden = false;
        aviso.textContent = "Link confirmado. Escolha e confirme sua nova senha.";
      } catch (erro) {
        aviso.textContent = erro && erro.message ? erro.message : "Não foi possível verificar o link. Abra o link mais recente do e-mail.";
      }
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const senha = document.getElementById("senha").value;
      const confirmacao = document.getElementById("confirmacao").value;

      if (senha !== confirmacao) {
        aviso.textContent = "As senhas estão diferentes. Confira e tente novamente.";
        return;
      }

      botao.disabled = true;
      aviso.textContent = "Salvando a nova senha…";
      try {
        const resultado = await comTempoLimite(cliente.auth.updateUser({ password: senha }));
        if (resultado.error) throw resultado.error;
        formulario.hidden = true;
        aviso.textContent = "Senha alterada com sucesso. Volte ao site Freitag Gestão para entrar.";
      } catch (erro) {
        aviso.textContent = erro && erro.message ? erro.message : "Não foi possível salvar. Tente novamente.";
        botao.disabled = false;
      }
    });

    iniciar();
  </script>
</body>
</html>
